name: Simulação do Oli (modelo real)

# Só manual: cada execução abre ~100 sessões no Gemini Live (custo). Não faz parte do CI normal.
on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Só cenários cujo id contém este texto (vazio = todos)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  eval:
    name: Cenários do Oli (3x cada, passa com 2/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simulação
        run: npx tsx scripts/eval-oli.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_LIVE_MODEL: ${{ vars.GEMINI_LIVE_MODEL }}
          EVAL_OLI_FILTRO: ${{ inputs.filtro }}
